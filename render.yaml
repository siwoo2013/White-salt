services:
  - type: web
    name: white-salt
    runtime: static
    buildCommand: mkdir -p dist && cp index.html editor.html favicon.ico favicon-32x32.png favicon-48x48.png apple-touch-icon.png dist/ && cp -R data dist/data && cp -R assets dist/assets && cp -R images dist/images && cp robots.txt dist/robots.txt
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
