services:
  - type: web
    name: white-salt
    runtime: static
    buildCommand: node scripts/build-site.js
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
