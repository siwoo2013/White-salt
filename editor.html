<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하얀솔트 페이지 콘텐츠 편집기</title><style>body{font-family:system-ui,sans-serif;background:#eef6f8;color:#16394b;margin:0}main{max-width:950px;margin:25px auto;padding:20px}.panel{background:white;border:1px solid #dbe8ec;border-radius:13px;padding:23px;margin:18px 0}h1{color:#087eaa}label{display:block;font-weight:bold;font-size:14px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b8cdd5;border-radius:7px;margin-top:5px;font:inherit}textarea{min-height:85px}button,.download{display:inline-block;border:0;border-radius:7px;background:#087dab;color:#fff;padding:12px 15px;margin:5px 6px 5px 0;cursor:pointer;font:inherit}.delete{background:#a84040}.help{color:#526a78}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}.preview{display:flex;gap:18px;border-top:1px solid #ddd;padding:18px 0}.preview img{width:42%;max-height:180px;object-fit:cover}.preview.reverse{flex-direction:row-reverse}@media(max-width:650px){main{padding:10px}.row,.preview{display:block}.preview img{width:100%}}</style></head><body><main><h1>White Salt 콘텐츠 편집기</h1><p class="help">페이지마다 섹션과 레이아웃을 독립적으로 선택하세요. 편집 후 JSON 파일을 다운로드하고 GitHub의 <code>data/pages.json</code>에 업로드하면 공개 사이트에 반영됩니다. 이 화면에서는 서버 내용이 직접 수정되지 않습니다.</p><div class="panel"><label>수정할 페이지 <select id="page"></select></label><button id="add">+ 새 섹션 추가</button><button id="download">pages.json 다운로드</button><label>기존 pages.json 불러오기 <input type="file" id="import" accept=".json,application/json"></label></div><div id="sections"></div><p class="help">레이아웃 종류: 텍스트 왼쪽 / 이미지 오른쪽, 이미지 왼쪽 / 텍스트 오른쪽, 가로 전체 이미지, 3열 이미지 카드, 텍스트만. 이미지 경로는 images/파일명 형식이며 GitHub에 해당 이미지도 업로드해야 합니다.</p><a href="index.html">← 홈페이지 돌아가기</a></main><script src="assets/editor.js"></script></body></html>
